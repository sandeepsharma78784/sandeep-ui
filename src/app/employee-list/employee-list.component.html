<h2>Add Employee</h2>
<form (ngSubmit)="onAddEmployee()" #empForm="ngForm">

  <label for="name">Name:</label>
  <input type="text" id="name" [(ngModel)]="newEmployee.name" name="name" required />

  <label for="salary">Salary:</label>
  <input type="number" id="salary" [(ngModel)]="newEmployee.salary" name="salary" required />

  <button type="submit" [disabled]="empForm.invalid">Add Employee</button>
</form>
addEmployeeToAuthDB
<div *ngIf="addError" style="color:red">{{ addError }}</div>
<div *ngIf="addSuccess" style="color:green">{{ addSuccess }}</div>

<hr>

<h2>Employee List</h2>

<div *ngIf="errorMessage" style="color:red">{{ errorMessage }}</div>

<ul>
  <li *ngFor="let emp of employees">
    {{ emp.id }} - {{ emp.name }}
  </li>
</ul>

  <button type="button" (click)="addEmployeeToAuthDB()">Add Employee to Auth db</button>
  <button type="button" (click)="login()">Login</button>
  <button type="button" (click)="getEmployees()">Get Employees</button>
